name: build-linux

on:
  workflow_dispatch:
  workflow_call:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extensions/triplecode-mvp/package-lock.json
      - name: Build Linux package
        run: bash scripts/build-linux.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TripleCode-linux-x64
          path: dist/TripleCode-linux-x64.tar.gz
          if-no-files-found: error

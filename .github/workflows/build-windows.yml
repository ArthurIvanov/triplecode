name: build-windows

on:
  workflow_dispatch:
  workflow_call:

jobs:
  package:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extensions/triplecode-mvp/package-lock.json
      - name: Build Windows package
        run: bash scripts/build-windows.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TripleCode-win32-x64
          path: |
            dist/TripleCode-win32-x64.zip
            dist/TripleCode-win32-x64.tar.gz
          if-no-files-found: error
